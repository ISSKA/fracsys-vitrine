<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName fracsys-vitrine.ch
	ServerAlias www.fracsys-vitrine.ch
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	# DocumentRoot security
	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf

	# Security: Block all hosts except fracsys-vitrine.ch and www subdomain
	RewriteEngine On
	RewriteCond %{HTTP_HOST} !^(www\.)?fracsys-vitrine\.ch$ [NC]
	RewriteRule ^ - [F,L]

	# Redirect www to non-www
	RewriteCond %{HTTP_HOST} ^www\.fracsys-vitrine\.ch$ [NC]
	RewriteRule ^ https://fracsys-vitrine.ch%{REQUEST_URI} [R=301,L]

	# Hide server signature from error pages
	ServerSignature Off

	# Security Headers
	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
	# script-src: the sha256 hash whitelists the inline <script type="importmap"> in index.html.
	# It is whitespace-sensitive -- regenerate after any edit to that block with:
	#   python3 -c "import re,hashlib,base64,pathlib;b=re.search(rb'<script type=\"importmap\">(.*?)</script>',pathlib.Path('webapp/html/index.html').read_bytes(),re.S).group(1);print('sha256-'+base64.b64encode(hashlib.sha256(b).digest()).decode())"
	Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ps7HUQTafWRO3xq5UOCN6kEUtXvdEibvJHvA1V82wDw=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.s3.eu-central-1.amazonaws.com https://*.s3.amazonaws.com; font-src 'self' data:; connect-src 'self' data: blob: https://*.execute-api.eu-central-1.amazonaws.com https://*.s3.eu-central-1.amazonaws.com https://*.s3.amazonaws.com;"
	SSLCertificateFile /etc/letsencrypt/live/fracsys-vitrine.ch/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/fracsys-vitrine.ch/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
