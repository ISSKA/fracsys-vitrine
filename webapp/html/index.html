<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FracSYS Vitrine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="controls">
        <h4>Mesh Viewer</h4>
        <button onclick="showFractureZone()">Fracture Zone</button><br>
        <button onclick="showDamageZone()">Damage Zone</button><br>

        <div id="layerControls" style="margin-top: 15px; margin-bottom: 15px; display: none;">
            <h4 id="layerControlsToggle" class="collapsible-toggle">Select layers to display</h4>
            <div id="layerCheckboxes"></div>
        </div>
        <button onclick="resetCamera()">Reset camera</button>
        <button onclick="toggleWireframe()">Toggle wireframe</button>
    </div>
    <div id="info">
        Controls: Rotate (left mouse button), Pan (right mouse button), Roll (Shift + left mouse buttin), Zoom (mouse wheel)
    </div>
    <div id="metadata"></div>
    <div id="download-progress" style="display: none;">
        <div id="download-progress-label"></div>
        <div id="download-progress-bar-track">
            <div id="download-progress-bar-fill"></div>
        </div>
        <div id="download-progress-pct">0%</div>
        <div id="download-progress-spinner"></div>
    </div>
    <div id="container"></div>

    <script type="module" src="/src/app.ts"></script>
</body>
</html>
