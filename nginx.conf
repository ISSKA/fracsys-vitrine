server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/csv application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # Grid CSVs may be swapped via a bind mount, so never cache them.
    # mime.types has no .csv entry, so without this the grid falls back to
    # application/octet-stream and misses gzip_types above.
    location /data/ {
        default_type text/csv;
        add_header   Cache-Control "no-cache";
        try_files    $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated or clients pin to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /flow/index.html {
        add_header Cache-Control "no-cache";
    }
}
