<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FracSYS Vitrine</title>
    <link rel="stylesheet" href="./vitrine-meshviewer/webapp/html/styles.css">
</head>
<body>
    <div id="controls">
        <h4>Mesh Viewer / <a href="./flow/">Flow Viewer</a></h4>
        <button id="btn-fracture-zone">Fracture Zone</button><br>
        <button id="btn-damage-zone">Damage Zone</button><br>
        <div id="damageZoneModelControls" style="margin-top: 10px; margin-bottom: 15px; display: none;">
            <div>
                <input type="radio" id="damage-zone-model-optimized" name="damage-zone-model" value="optimized" checked>
                <label for="damage-zone-model-optimized">optimized model</label>
            </div>
            <div>
                <input type="radio" id="damage-zone-model-full" name="damage-zone-model" value="full">
                <label for="damage-zone-model-full">full model</label>
            </div>
        </div>

        <div id="layerControls" style="margin-top: 15px; margin-bottom: 15px; display: none;">
            <h4 id="layerControlsToggle" class="collapsible-toggle">Select layers to display</h4>
            <div id="layerCheckboxes"></div>
        </div>
        <button id="btn-reset-camera">Reset camera</button>
        <button id="btn-toggle-wireframe">Toggle wireframe</button>
    </div>
    <div id="info">
        Controls: Rotate (left mouse button), Pan (right mouse button), Roll (Shift + left mouse button), Zoom (mouse wheel)
    </div>
    <div id="metadata"></div>
    <div id="download-progress" style="display: none;">
        <div id="download-progress-label"></div>
        <div id="download-progress-bar-track">
            <div id="download-progress-bar-fill"></div>
        </div>
        <div id="download-progress-pct">0%</div>
        <div id="download-progress-spinner"></div>
    </div>
    <div id="container"></div>

    <script type="module" src="./vitrine-meshviewer/webapp/html/src/app.ts"></script>
</body>
</html>
