services:
  # Unified production bundle: mesh at / and flow at /flow/.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        DEPLOY_BASE: ${DEPLOY_BASE:-/}
        VITE_DEFAULT_GRID_FILENAME: ${VITE_DEFAULT_GRID_FILENAME:-flow_network_voxels.csv}
    image: fracsys-vitrine:latest
    ports:
      - "8080:80"
    restart: unless-stopped
    # Swap grid CSVs without rebuilding the image:
    # volumes:
    #   - ./public/data:/usr/share/nginx/html/data:ro

  # Unified dev server with hot reload on http://localhost:3000.
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      DEPLOY_BASE: /
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
