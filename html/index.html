<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FracSYS Devanture</title>
    <style>
        html, body {
          margin: 0;
          height: 100%;
          font-family: Arial, sans-serif;
        }
        #c {
          width: 100%;
          height: 100%;
          display: block;
        }
        #help-panel {
          position: absolute;
          top: 10px;
          left: 20px;
          background-color: rgba(96,93,90,0.5);
          color: white;
          padding: 15px;
          border-radius: 5px;
          font-size: 12px;
          line-height: 1.4;
          pointer-events: none;
        }
        #help-panel h3 {
          margin: 0 0 10px 0;
          font-size: 13px;
        }
        #help-panel ul {
          margin: 0;
          padding-left: 20px;
        }
        #help-panel li {
          margin: 5px 0;
        }
        #loading-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.8);
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          z-index: 1000;
        }
        #loading-overlay.hidden {
          display: none;
        }
        #loading-text {
          color: white;
          font-size: 18px;
          margin-bottom: 20px;
        }
        #progress-bar-container {
          width: 300px;
          height: 30px;
          background-color: rgba(96,93,90,0.5);
          border-radius: 15px;
          overflow: hidden;
          border: 2px solid rgba(255,255,255,0.3);
        }
        #progress-bar {
          height: 100%;
          width: 0%;
          background: linear-gradient(90deg, #4CAF50, #8BC34A);
          transition: width 0.3s ease;
          display: flex;
          align-items: center;
          justify-content: flex-end;
          padding-right: 10px;
          box-sizing: border-box;
        }
        #progress-percentage {
          color: white;
          font-size: 14px;
          font-weight: bold;
          text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
            }
        }
    </script>
  </head>
  <body>
    <div id="loading-overlay">
      <div id="loading-text">Chargement du modèle 3D...</div>
      <div id="progress-bar-container">
        <div id="progress-bar">
          <span id="progress-percentage">0%</span>
        </div>
      </div>
    </div>
    <canvas id="c"></canvas>
    <div id="help-panel">
      <h3>Contrôles</h3>
      <ul>
        <li><strong>Bouton gauche :</strong> Rotation de la vue</li>
        <li><strong>Shift + Bouton gauche :</strong> Rotation axe Z</li>
        <li><strong>Bouton droit :</strong> Déplacement de la vue</li>
        <li><strong>Molette :</strong> Zoom avant/arrière</li>
      </ul>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
