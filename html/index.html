<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FracSYS Devanture</title>
    <style>
        html, body {
          margin: 0;
          height: 100%;
          font-family: Arial, sans-serif;
        }
        #c {
          width: 100%;
          height: 100%;
          display: block;
        }
        #help-panel {
          position: absolute;
          top: 10px;
          left: 20px;
          background-color: rgba(96,93,90,0.5);
          color: white;
          padding: 15px;
          border-radius: 5px;
          font-size: 12px;
          line-height: 1.4;
          pointer-events: none;
        }
        #help-panel h3 {
          margin: 0 0 10px 0;
          font-size: 13px;
        }
        #help-panel ul {
          margin: 0;
          padding-left: 20px;
        }
        #help-panel li {
          margin: 5px 0;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
            }
        }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="help-panel">
      <h3>Contrôles</h3>
      <ul>
        <li><strong>Bouton gauche :</strong> Rotation de la vue</li>
        <li><strong>Shift + Bouton gauche :</strong> Rotation axe Z</li>
        <li><strong>Bouton droit :</strong> Déplacement de la vue</li>
        <li><strong>Molette :</strong> Zoom avant/arrière</li>
      </ul>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
