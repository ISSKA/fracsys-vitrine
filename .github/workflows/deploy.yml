name: Build and Deploy

on:
  push:
    paths:
      - "public/data/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout webapp repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy via SFTP
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}" <<EOF
          cd sites/fracsys.isska.ch
          put -r dist/*
          bye
          EOF